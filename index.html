<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Momentum</title>
  </head>
  <body>
    <!-- login-form  로그인 폼 -->
    <form id="login-form" class="hidden">
      <input
        required
        maxlength="15"
        type="text"
        placeholder="what is your name?"
      />
      <input type="submit" value="Log in" />
      <a href="https://nomadcoders.co/">Go to link</a>
    </form>

    <header id="header">
      <button id="back-button" type="button" aria-label="Back">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M15 6L9 12L15 18"
            stroke="#565656"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <!-- weather 날씨: 상태 · 온도 · 도시 -->
      <div id="weather">
        <span id="weather-condition"></span>
        <span class="weather-separator" aria-hidden="true"></span>
        <span id="temp"></span>
        <span class="weather-separator" aria-hidden="true"></span>
        <span id="city"></span>
      </div>
    </header>

    <main id="main">
      <h1 id="greeting" class="hidden">hidden h1</h1>

      <!-- clock 시간 -->
      <h2 id="clock">00:00:00</h2>

      <!-- todo List 투두 리스트 -->
      <form id="todo-form">
        <input type="text" placeholder="Write a Todo and Press Enter" />
      </form>
      <ul id="todo-list"></ul>
      <!-- ul = Unorderd List -->
      <!-- li = List Item -->
    </main>

    <!-- 명언 랜덤 생성 -->
    <div id="quote">
      <span></span>
      <span></span>
    </div>
    <!-- <img src="img/1.jpg"> -->
    <script src="js/greetings.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/quotes.js"></script>
    <script src="js/background.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/weather.js"></script>
  </body>
</html>
